name: Publish MAXi-FLIX update

on:
  push:
    branches:
      - "release/1.7.0"
    tags:
      - "maxiflix-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag da versão que será publicada"
        required: true
        default: "maxiflix-v1.8.28"
        type: string

permissions:
  contents: write

concurrency:
  group: maxiflix-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      MAXIFLIX_SIGNING_BUNDLE: ${{ secrets.MAXIFLIX_SIGNING_BUNDLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Validate signing key and prepare keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAXIFLIX_SIGNING_BUNDLE" || { echo "Missing MAXIFLIX_SIGNING_BUNDLE secret"; exit 1; }
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib

          bundle = json.loads(base64.b64decode(os.environ["MAXIFLIX_SIGNING_BUNDLE"]))
          store_b64 = bundle["keystoreBase64"]
          store_password = bundle["keystorePassword"]
          key_alias = bundle["keyAlias"]
          key_password = bundle["keyPassword"]
          if not all([store_b64, store_password, key_alias, key_password]):
              raise SystemExit("Signing bundle is incomplete")

          keystore_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maxiflix-release.jks"
          keystore_path.write_bytes(base64.b64decode(store_b64))
          keystore_path.chmod(0o600)

          for secret in (store_b64, store_password, key_password):
              print(f"::add-mask::{secret}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"MAXIFLIX_KEYSTORE_PATH={keystore_path}\n")
              env.write(f"MAXIFLIX_KEYSTORE_PASSWORD={store_password}\n")
              env.write(f"MAXIFLIX_KEY_ALIAS={key_alias}\n")
              env.write(f"MAXIFLIX_KEY_PASSWORD={key_password}\n")
          PY

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MAXIFLIX_KEYSTORE_PATH"
          test -n "$MAXIFLIX_KEYSTORE_PASSWORD"
          test -n "$MAXIFLIX_KEY_ALIAS"
          test -n "$MAXIFLIX_KEY_PASSWORD"
          gradle --no-daemon :app:clean :app:assembleRelease
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          mkdir -p release
          cp "$APK_PATH" release/MAXi-FLIX.apk

      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          gradle_file = pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle_file).group(1))
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_file).group(1)
          apk = pathlib.Path("release/MAXi-FLIX.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              "enabled": True,
              "versionCode": version_code,
              "versionName": version_name,
              "apkFile": "MAXi-FLIX.apk",
              "apkSha256": digest,
              "apkSizeBytes": apk.stat().st_size,
              "releaseNotes": "Oculta somente o texto e o logotipo REDEDECANAIS.IN, sem sobreposição sobre os controles do site."
          }
          pathlib.Path("release/update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MAXi-FLIX ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'maxiflix-v1.8.28' }}
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'maxiflix-v1.8.28' }}
          target_commitish: release/1.7.0
          generate_release_notes: true
          files: |
            release/MAXi-FLIX.apk
            release/update.json
